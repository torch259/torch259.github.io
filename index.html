<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人主页</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="#/home">· 我的主页</a>
      <nav class="nav" id="site-nav">
        <a href="#/home"  data-view="home">首页</a>
        <a href="#/about" data-view="about">关于</a>
        <a href="#/works" data-view="works">作品</a>
        <a href="#/music" data-view="music">音乐</a>
        <a href="#/tools" data-view="tools" id="nav-tools">小工具</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- ============================================================
         首页：个人名片 + 实时时钟/日历（总览层）
         ============================================================ -->
    <section id="view-home" class="view active" data-title="首页">
      <div class="container home-grid">
        <!-- 左：名片 -->
        <div class="hero card">
          <div id="avatar" class="avatar"></div>
          <h1 id="nickname">昵称</h1>
          <p id="motto" class="motto">个人格言</p>
          <p id="intro" class="intro"></p>
        </div>

        <!-- 右：时间 + 日历 -->
        <aside class="home-widgets">
          <div id="clock" class="widget clock-widget" aria-label="实时时钟"></div>
          <div id="calendar" class="widget calendar-widget" aria-label="日历"></div>
        </aside>
      </div>

      <!-- 模块入口卡片：让首页成为"总览"，各模块独立成页 -->
      <div class="container module-block">
        <h2 class="section-title">模块入口</h2>
        <div id="quick-links" class="quick-links"></div>
      </div>
    </section>

    <!-- ============================================================
         关于我
         ============================================================ -->
    <section id="view-about" class="view" data-title="关于我">
      <div class="container">
        <div class="page-head">
          <h1 class="page-title">关于我</h1>
          <p class="page-desc">一点自我介绍，还有我的爱好。</p>
        </div>
        <div class="card about-card">
          <p id="about-intro" class="about-intro"></p>
          <h2 class="section-title">爱好</h2>
          <div id="hobbies" class="hobbies"></div>
        </div>
      </div>
    </section>

    <!-- ============================================================
         作品库
         ============================================================ -->
    <section id="view-works" class="view" data-title="作品库">
      <div class="container">
        <div class="page-head">
          <h1 class="page-title">作品库</h1>
          <p class="page-desc">我的 GitHub 公开项目（在 <code>js/config.js</code> 里填用户名即可接入）。</p>
        </div>
        <div id="repos" class="repos">
          <p class="placeholder">加载中…</p>
        </div>
      </div>
    </section>

    <!-- ============================================================
         音乐播放器
         ============================================================ -->
    <section id="view-music" class="view" data-title="音乐">
      <div class="container">
        <div class="page-head">
          <h1 class="page-title">音乐</h1>
          <p class="page-desc">把音频文件放进 <code>music/</code>，在 <code>js/config.js</code> 登记即可。</p>
        </div>

        <div class="player idle">
          <div class="player-cover">
            <div id="cover" class="cover">♪</div>
            <div>
              <div id="song-title" class="song-title">未播放</div>
              <div id="song-artist" class="song-artist">—</div>
            </div>
          </div>
          <div class="player-controls">
            <button id="btn-prev" class="ctrl" title="上一首">⏮</button>
            <button id="btn-play" class="ctrl play" title="播放/暂停">▶</button>
            <button id="btn-next" class="ctrl" title="下一首">⏭</button>
          </div>
          <div class="progress">
            <span id="cur">0:00</span>
            <input type="range" id="seek" min="0" max="100" value="0" />
            <span id="dur">0:00</span>
          </div>
          <div class="volume">
            <span>🔊</span>
            <input type="range" id="volume" min="0" max="100" value="80" />
          </div>
        </div>

        <!-- 可折叠歌单 -->
        <div class="playlist-box">
          <button type="button" id="playlist-toggle" class="playlist-toggle" aria-expanded="true">
            <span class="pl-icon">🎵</span>
            <span class="pl-title">播放列表</span>
            <span id="playlist-status" class="pl-status"></span>
            <span class="caret" aria-hidden="true">▾</span>
          </button>
          <div class="playlist-collapse open">
            <ul id="playlist" class="playlist"></ul>
          </div>
        </div>
      </div>
    </section>

    <!-- ============================================================
         小工具：仅展示已上线内容；未上线条目整体隐藏，上线后自动出现
         ============================================================ -->
    <section id="view-tools" class="view" data-title="小工具">
      <div class="container">
        <div class="page-head">
          <h1 class="page-title">小工具</h1>
          <p id="tools-desc" class="page-desc">已上线的小工具都在这里。</p>
        </div>
        <div id="feature-list" class="features"></div>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© <span id="year"></span> <span id="footer-name"></span> · 由静态页面构建</p>
    </div>
  </footer>

  <noscript>
    <p style="text-align:center;padding:24px;">本页面需要启用 JavaScript 才能正常显示。</p>
  </noscript>

  <script src="js/config.js"></script>
  <script src="js/main.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/router.js"></script>
  <script src="js/github.js"></script>
  <script src="js/player.js"></script>
</body>
</html>
